
services:
  postgres:
    image: postgres:17
    container_name: integration_hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: integration_hub
      POSTGRES_USER: integration_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration_user -d integration_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
